name = "lorstar0121"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ── KV 命名空间：存聊天云备份 + 待推送队列。
#    绑定名必须叫 CHAT_BACKUPS，要跟 worker.js 里 env.CHAT_BACKUPS 对上。
#    去 Cloudflare 控制台创建：Workers 和 Pages → KV → 创建命名空间，
#    名字随便取（比如就叫 CHAT_BACKUPS），创建后把它的 id 填到下面。
[[kv_namespaces]]
binding = "Savit"
id = "8366503c83594585bac278e02c808453"

# ── Cron 触发器：每 5 分钟检查一次要不要主动补一条消息 ──
[[triggers]]
crons = ["*/5 * * * *"]

# ── 下面这些去 Cloudflare 控制台：这个 Worker 项目 → 设置 → 变量和机密 → 添加变量 里填，
#    不要写在这个文件里（这个文件会被提交进 GitHub，写在这里等于密码公开）：
#
#   RELAY_SECRET             类型选"密钥"(Secret)   —— 你自己定的密码，网站那边也要填一样的
#   ONESIGNAL_APP_ID         类型选"文本"就行
#   ONESIGNAL_REST_API_KEY   类型选"密钥"(Secret)   —— 去 OneSignal 后台 Settings → Keys & IDs 复制
#   SITE_URL                 类型选"文本"，填 https://lorstar0121.netlify.app（可选，不填也行）
