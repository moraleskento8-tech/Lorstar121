[build]
  functions = "netlify/functions"
  # 如果你的仓库根目录本来就没有构建步骤（纯静态站点），保持 command 为空即可，
  # Netlify 仍然会执行 npm install 来安装下面 functions 需要的 @netlify/blobs 依赖。
  # command = ""
  # publish = "."

[functions."scheduled-proactive"]
  # 每 5 分钟检查一次是否有"主动消息"到点该推送
  # cron 格式：分 时 日 月 星期，可在 https://crontab.guru 上验证
  schedule = "*/5 * * * *"
